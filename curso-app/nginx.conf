# Servidor estático da aplicação do curso (plano do M0, seção 3).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Redirecionamentos relativos: a porta publicada (4321) difere da interna (8080).
    absolute_redirect off;

    # Nenhum recurso de fora do próprio endereço (E4, seção 7, regra 3).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
