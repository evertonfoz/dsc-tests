# Estado do UC12 reconciliado com o método (piloto, Etapa 6).
# Proveniência: A–E foram executadas no laboratório (celillac-backend-prepare) sob o método antigo, por camada técnica.
# Aqui as entregas são reorganizadas por comportamento; nenhum gate está aprovado: aguarda validação humana.
uc: UC12
nome: Cadastrar Produto
documento: ../../planejamento/uc12-cadastrar-produto/uc-12.md
arquetipo: criar
epic: { issue: 23, estado: open }   # reconciliação do piloto; a Epic #1 (laboratório) está fechada e permanece como histórico
fase_atual: F

fases:
  A:
    status: concluida
    relatorio: relatorios/A.md
    gate:
      - { item: "Todo item do UC12 mapeado (fatia, ADR ou pergunta)", resultado: aprovado, por: evertonfoz }
      - { item: "Issue de reconciliação criada e conferida com este arquivo", resultado: aprovado, por: evertonfoz }
      - { item: "Fatias F03 e F04 com DoR avaliada e teste RED nomeado", resultado: aprovado, por: evertonfoz }
    evidencias: [evidencias/A/testes-do-uc12.txt, evidencias/A/publicacao.txt]
  B:
    status: concluida              # reaberta em 2026-11-20 (ADR-004 do método) e fechada com F05 e F06 integradas
    relatorio: relatorios/B.md
    gate:
      - { item: "Todas as fatias integradas na branch principal", resultado: aprovado, por: CI }
      - { item: "CI verde na branch principal", resultado: aprovado, por: CI }
    evidencias: [evidencias/B/f03-green.txt, evidencias/B/f04-green.txt, evidencias/B/f05-green.txt, evidencias/B/f06-green.txt]
  C:
    status: concluida              # reaberta em 2026-11-20 para o C1b; fechada com o PR 46
    relatorio: relatorios/C.md
    gate:
      - { item: "C1 (fronteira HTTP) integrada, com o mapeamento dos erros do núcleo", resultado: aprovado, por: CI }
      - { item: "C2 (persistência real) integrada, com migration verificada em banco novo", resultado: aprovado, por: CI }
      - { item: "C1b (DTO e formato único do 400) integrada", resultado: aprovado, por: CI }
      - { item: "CI verde na branch principal", resultado: aprovado, por: CI }
    evidencias: [evidencias/C/c1-green.txt, evidencias/C/c2-fe01-caracterizacao.txt, evidencias/C/c2-migration-banco-vazio.txt, evidencias/C/c1b-red.txt, evidencias/C/c1b-green.txt, evidencias/C/c1b-refactor.txt]
  D:
    status: concluida
    relatorio: relatorios/D.md
    gate:
      - { item: "Cada rota do UC tem sucesso e erros documentados e testados", resultado: aprovado, por: CI }
      - { item: "Divergências com o UC resolvidas ou com ADR", resultado: aprovado, por: CI }
      - { item: "CI verde na branch principal", resultado: aprovado, por: CI }
    evidencias: [evidencias/D/contrato-atual.txt, evidencias/D/contrato-final.txt]
  E:
    status: concluida
    relatorio: relatorios/E.md
    gate:
      - { item: "Cada rota do contrato tem cenário na coleção", resultado: aprovado, por: evertonfoz }
      - { item: "O script termina com 0 falhas em ambiente limpo", resultado: aprovado, por: evertonfoz }
      - { item: "O mesmo script passa no CI (smoke)", resultado: aprovado, por: CI }
      - { item: "Durabilidade provada", resultado: aprovado, por: evertonfoz }
      - { item: "Nenhum segredo nos arquivos versionados", resultado: aprovado, por: evertonfoz }
    evidencias: [evidencias/E/diagnostico.md, evidencias/E/run-checks.txt, evidencias/E/run-checks-controle-negativo.txt, evidencias/E/durabilidade.txt]
  F:
    status: em_andamento
    relatorio: relatorios/F.md
    gate:
      - { item: "Todo item do UC tem teste que o prova ou ADR", resultado: pendente }
      - { item: "Nenhuma afirmação de cobertura sem prova", resultado: pendente }
      - { item: "Arquitetura em conformidade, achados tratados", resultado: pendente }
      - { item: "state.yaml, documentos e GitHub consistentes", resultado: aprovado, por: CI }
      - { item: "CI verde na branch principal", resultado: aprovado, por: CI }
      - { item: "Issues e Epic fechados", resultado: pendente }
    evidencias: [evidencias/F/cobertura.md, evidencias/F/auditoria.md, evidencias/F/testes.txt, evidencias/F/a7-mutacao.txt]

